<svg viewBox="0 0 280 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Grey gradient background with increasing transparency from bottom to top -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#666666;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#888888;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#AAAAAA;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background rectangle -->
  <rect width="280" height="120" fill="url(#bgGradient)"/>
  
  <!-- Newton's method formula in mathematical notation -->
  <g font-family="serif" font-size="18" fill="#000000">
    <!-- x_{n+1} = x_n - -->
    <text x="30" y="45">
      <tspan font-style="italic">x</tspan><tspan font-size="12" dy="4">n+1</tspan><tspan dy="-4"> = </tspan><tspan font-style="italic">x</tspan><tspan font-size="12" dy="4">n</tspan><tspan dy="-4"> − </tspan>
    </text>
    
    <!-- Fraction: f'(x_n) / f''(x_n) - much closer spacing -->
    <!-- Numerator -->
    <text x="118" y="35" font-style="italic" font-size="16">f<tspan dx="2" font-size="14" dy="-4">′</tspan><tspan dy="4">(x</tspan><tspan font-size="11" dy="3">n</tspan><tspan dy="-3">)</tspan></text>
    
    <!-- Fraction line - shorter -->
    <line x1="116" y1="42" x2="160" y2="42" stroke="#000000" stroke-width="1.5"/>
    
    <!-- Denominator -->
    <text x="115" y="58" font-style="italic" font-size="16">f<tspan dx="2" font-size="14" dy="-4">′′</tspan><tspan dy="4">(x</tspan><tspan font-size="11" dy="3">n</tspan><tspan dy="-3">)</tspan></text>
  </g>
  
  <!-- "numerical methods" text in red, lowercase, closer together -->
  <text x="45" y="90" font-family="sans-serif" font-size="24" font-weight="bold" fill="#DC143C">numerical methods</text>
  
</svg>